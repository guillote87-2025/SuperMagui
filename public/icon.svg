<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />
  
  <g filter="url(#shadow)" transform="translate(10, 0)">
    <!-- Shopping bag / cart elements -->
    <!-- Cart wheels -->
    <circle cx="190" cy="390" r="28" fill="#ffffff" />
    <circle cx="190" cy="390" r="12" fill="#047857" />
    <circle cx="340" cy="390" r="28" fill="#ffffff" />
    <circle cx="340" cy="390" r="12" fill="#047857" />

    <!-- Cart Basket Wireframe / Solid Modern Style -->
    <path d="M120 160 H155 L185 320 H360 L395 190 H170" 
          fill="none" 
          stroke="url(#cartGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Checklist items inside cart -->
    <!-- Checklist sheet -->
    <rect x="210" y="110" width="130" height="150" rx="16" fill="#ffffff" />
    <!-- Checkmarks / lines -->
    <path d="M232 145 L242 155 L260 137" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="272" y1="148" x2="315" y2="148" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    
    <path d="M232 185 L242 195 L260 177" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="272" y1="188" x2="315" y2="188" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <circle cx="242" cy="225" r="5" fill="#94a3b8" />
    <line x1="272" y1="225" x2="305" y2="225" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Fresh Apple / Fruit accent in cart -->
    <circle cx="185" cy="195" r="24" fill="#ef4444" />
    <path d="M185 171 C187 160 195 158 198 158" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" />
    <path d="M198 158 C192 165 198 168 198 158 Z" fill="#22c55e" />
  </g>
</svg>
